[extensions]
# Time series pointer-file ingestion into a live PSY System (the code formerly in
# PowerSystemCaseBuilder). TimeSeries is a trigger only for its TimeArray type; it
# always loads with PowerSystems, which depends on it.
PowerTableDataParserPowerSystemsExt = ["PowerSystems", "TimeSeries"]

[sources]
# Sibling-checkout paths, not a git rev: the x-unit accessors these packages
# expose are generated and not yet released. Switch to a tagged rev before merge.
PowerCoreOpenAPIModels = {path = "../PowerOpenAPIModels/PowerCoreOpenAPIModels.jl"}
PowerOperationsOpenAPIModels = {path = "../PowerOpenAPIModels/PowerOperationsOpenAPIModels.jl"}
